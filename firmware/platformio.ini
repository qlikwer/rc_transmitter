; Прошивка пульта "Кораблик". Документация: хранилище Obsidian, 50 Хобби/Кораблик/Пульт.md
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    nrf24/RF24@^1.4.9
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; --- TFT_eSPI: настройка экрана здесь, User_Setup.h библиотеки не используется ---
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    ; Вариант "таба" зависит от модуля. Если цвета/смещение неверны, попробовать
    ; ST7735_GREENTAB, ST7735_GREENTAB2, ST7735_GREENTAB3, ST7735_REDTAB
    -DST7735_BLACKTAB=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    ; MISO экрану не нужен, но объявлен, чтобы SPI.begin() подключил линию 19 для радио
    -DTFT_MISO=19
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=27000000
    -DSUPPORT_TRANSACTIONS=1

; Тестовый приёмник на второй ESP32 + nRF24 (CE=4, CSN=5, SCK/MISO/MOSI 18/19/23).
; Печатает каналы в Serial и отвечает телеметрией. Сборка: pio run -e rx_test
[env:rx_test]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    nrf24/RF24@^1.4.9
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc
    ; адрес (5 символов) и канал должны совпадать с пресетом пульта
    -DRX_ADDR=\"BOAT1\"
    -DRX_CHANNEL=76
build_src_filter =
    -<*>
    +<../receiver/rx_test.cpp>
